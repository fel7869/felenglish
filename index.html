<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🌟 背诗小游戏</title>
<style>
  :root{
    --bg1:#ffe9b3; --bg2:#ffd1dc; --bg3:#b3e5ff;
    --card:#ffffff; --ink:#3a2e2e; --accent:#ff7a59; --accent2:#5b8def;
    --good:#3ec46d; --soft:#fff6e6; --fs:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color:var(--ink); font-size:var(--fs);
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%; animation:bgshift 18s ease infinite;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{width:100%; max-width:760px; padding:14px; flex:1; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .title{font-size:1.4em; font-weight:800; color:#d24b6a; text-shadow:1px 1px 0 #fff;}
  .topbtn{background:#fff; border:none; border-radius:14px; padding:8px 12px; font-size:.8em; box-shadow:0 3px 0 #e7c9a0; cursor:pointer;}
  .topbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #e7c9a0;}
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.active{display:flex;}
  .card{background:var(--card); border-radius:22px; padding:18px; box-shadow:0 8px 22px rgba(0,0,0,.12); margin-bottom:14px;}
  h2{margin:.2em 0 .4em; color:var(--accent2);}
  .poem-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .poem-tile{background:var(--soft); border-radius:18px; padding:14px 10px; text-align:center; cursor:pointer; border:3px solid transparent; transition:.15s;}
  .poem-tile:hover{border-color:#ffd27a; transform:translateY(-3px);}
  .poem-tile .pt{font-weight:800; font-size:1.05em;}
  .poem-tile .pa{font-size:.7em; color:#9a7b5b; margin-top:4px;}
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .mode-tile{background:linear-gradient(135deg,#fff,#fff4e0); border-radius:18px; padding:18px 12px; text-align:center; cursor:pointer; box-shadow:0 4px 0 #f0d3a0; border:none; font-size:1em; color:var(--ink);}
  .mode-tile:active{transform:translateY(3px); box-shadow:0 1px 0 #f0d3a0;}
  .mode-tile .emo{font-size:1.8em; display:block; margin-bottom:6px;}
  .btn{background:var(--accent); color:#fff; border:none; border-radius:16px; padding:12px 18px; font-size:1em; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #d6553c;}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #d6553c;}
  .btn.blue{background:var(--accent2); box-shadow:0 4px 0 #3a6bc4;}
  .btn.ghost{background:#fff; color:var(--ink); box-shadow:0 4px 0 #e3d4bd;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row.center{justify-content:center;}
  .poem-show{font-size:1.4em; line-height:1.9; text-align:center; letter-spacing:2px;}
  .py{font-size:.6em; color:#7a8aa0; letter-spacing:1px;}
  .note{background:#f1fbff; border-left:6px solid var(--accent2); border-radius:12px; padding:12px 14px; font-size:.9em; line-height:1.7; margin-top:10px;}
  .note b{color:var(--accent2);}
  .blank{display:inline-block; min-width:1.4em; border-bottom:3px dashed var(--accent); color:var(--accent); text-align:center; font-weight:800;}
  .opts{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px;}
  .opt{background:#fff; border:3px solid #ffd27a; border-radius:16px; padding:12px 18px; font-size:1.3em; cursor:pointer; min-width:54px; text-align:center;}
  .opt:active{transform:scale(.95);}
  .opt.ok{background:var(--good); color:#fff; border-color:var(--good);}
  .opt.no{background:#ff8a8a; color:#fff; border-color:#ff8a8a; animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .order-card{background:var(--soft); border-radius:16px; padding:14px; margin:8px 0; font-size:1.2em; text-align:center; cursor:pointer; border:3px solid transparent;}
  .order-card.picked{border-color:var(--accent); background:#fff0d8;}
  .order-card.done{background:#d8f5e2; border-color:var(--good);}
  .stars{font-size:1.8em; text-align:center; letter-spacing:6px; margin:10px 0;}
  .big-emoji{font-size:3em; text-align:center; margin:8px 0;}
  .float{position:fixed; font-size:1.6em; animation:rise 1.4s ease-out forwards; pointer-events:none;}
  @keyframes rise{0%{transform:translateY(0) scale(1); opacity:1}100%{transform:translateY(-160px) scale(1.6); opacity:0}}
  label{display:block; font-size:.85em; margin:10px 0 4px; color:#7a5b3b; font-weight:700;}
  input,textarea,select{width:100%; font-size:1em; padding:10px; border-radius:12px; border:2px solid #e6d3b3; font-family:inherit; background:#fffdf8;}
  textarea{resize:vertical; min-height:70px; line-height:1.6;}
  .hint{font-size:.72em; color:#9a8; margin-top:2px;}
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#3a2e2e; color:#fff; padding:10px 18px; border-radius:20px; font-size:.85em; opacity:0; transition:.3s; pointer-events:none; z-index:99;}
  .toast.show{opacity:.95;}
  .mini{font-size:.7em; color:#9a8; text-align:center; margin-top:6px;}
  .back{font-size:.8em; background:none; border:none; color:var(--accent2); cursor:pointer; padding:6px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">🌟 背诗小游戏</div>
    <div class="row">
      <button class="topbtn" id="ageBtn">👶 难度：小学低</button>
      <button class="topbtn" id="musicBtn">🎵 音乐：关</button>
      <button class="topbtn" id="homeBtn">🏠 回首页</button>
    </div>
  </header>

  <!-- 主菜单 -->
  <section class="screen active" id="menu">
    <div class="card">
      <h2>第一步：选一首诗 📖</h2>
      <div class="poem-grid" id="poemGrid"></div>
    </div>
  </section>

  <!-- 选玩法 -->
  <section class="screen" id="modes">
    <button class="back" id="backToMenu">← 换一首诗</button>
    <div class="card">
      <h2 id="modesTitle">第二步：选个玩法 🎮</h2>
      <div class="mode-grid">
        <button class="mode-tile" data-mode="study"><span class="emo">📚</span>先学一学</button>
        <button class="mode-tile" data-mode="blank"><span class="emo">✏️</span>挖空填字</button>
        <button class="mode-tile" data-mode="match"><span class="emo">🔗</span>对句选择</button>
        <button class="mode-tile" data-mode="order"><span class="emo">🔀</span>诗句排序</button>
        <button class="mode-tile" data-mode="read"><span class="emo">🎤</span>听读跟读</button>
      </div>
    </div>
  </section>

  <!-- 学习 -->
  <section class="screen" id="study">
    <button class="back" id="backToModes1">← 换玩法</button>
    <div class="card">
      <h2 id="studyTitle"></h2>
      <div class="poem-show" id="studyPoem"></div>
      <div class="row center" style="margin-top:14px;">
        <button class="btn blue" id="readAllBtn">🔊 朗读全诗</button>
      </div>
      <div class="note" id="studyNote"></div>
    </div>
    <div class="row center">
      <button class="btn" id="studyPlay">去玩一玩 →</button>
    </div>
  </section>

  <!-- 游戏通用容器 -->
  <section class="screen" id="game">
    <button class="back" id="backToModes2">← 换玩法</button>
    <div class="card" id="gameCard"></div>
    <div class="row center">
      <button class="btn ghost" id="replayBtn">🔄 再来一次</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="result">
    <div class="card">
      <div class="big-emoji" id="resEmoji">🎉</div>
      <div class="stars" id="resStars"></div>
      <div id="resText" style="text-align:center; font-size:1em;"></div>
      <div class="row center" style="margin-top:14px;">
        <button class="btn" id="resAgain">🔄 再玩一次</button>
        <button class="btn blue" id="resMenu">🏠 回首页</button>
      </div>
    </div>
  </section>


</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 诗词数据 ===================== */
/* 想加诗？在下面 DEFAULT_POEMS 数组里照着格式加一段就行（每首含 week 字段，用于按周归档分组）。 */
const DEFAULT_POEMS = [
  { id:"zichao", title:"自嘲", author:"鲁迅", dynasty:"民国", week:"第六周",
    lines:["运交华盖欲何求","未敢翻身已碰头","破帽遮颜过闹市","漏船载酒泛中流","横眉冷对千夫指","俯首甘为孺子牛","躲进小楼成一统","管他冬夏与春秋"],
    pinyin:["yùn jiāo huá gài yù hé qiú","wèi gǎn fān shēn yǐ pèng tóu","pò mào zhē yán guò nào shì","lòu chuán zài jiǔ fàn zhōng liú","héng méi lěng duì qiān fū zhǐ","fǔ shǒu gān wèi rú zǐ niú","duǒ jìn xiǎo lóu chéng yī tǒng","guǎn tā dōng xià yǔ chūn qiū"],
    note:"这是鲁迅爷爷在1932年写的一首很有名的诗。那时候他处境很危险，常常碰壁，出门都要用破帽子遮住脸，坐的船都漏了水。但他一点都不害怕：别人指责他，他就横起眉毛冷冷地面对；他心甘情愿像老黄牛一样为老百姓做事。最后他说：躲进自己的小楼里，安安静静写自己的文章，不管外面冬天夏天、季节怎么变化。这首诗最出名的两句是“横眉冷对千夫指，俯首甘为孺子牛”——对坏人和指责绝不低头，对人民心甘情愿奉献。",
    words:{ "华盖":"这里指运气不好、处处碰壁", "闹市":"热闹的街市", "中流":"河的中间", "横眉":"竖着眉毛，表示不屈服", "千夫指":"千夫所指，指许多人的指责", "俯首":"低下头", "孺子牛":"为老百姓服务的老黄牛", "一统":"自成一个小天地" } },

  { id:"wenqinhua", title:"折桂令·问秦淮", author:"孔尚任", dynasty:"清", week:"第六周",
    lines:["问秦淮旧日窗寮","破纸迎风，坏槛当潮","目断魂消","当年粉黛，何处笙箫","罢灯船端阳不闹","收酒旗重九无聊","白鸟飘飘，绿水滔滔","嫩黄花有些蝶飞，新红叶无个人瞧"],
    pinyin:["wèn qín huái jiù rì chuāng liáo","pò zhǐ yíng fēng，huài kǎn dāng cháo","mù duàn hún xiāo","dāng nián fěn dài，hé chù shēng xiāo","bà dēng chuán duān yáng bù nào","shōu jiǔ qí chóng jiǔ wú liáo","bái niǎo piāo piāo，lǜ shuǐ tāo tāo","nèn huáng huā yǒu xiē dié fēi，xīn hóng yè wú gè rén qiáo"],
    note:"这支曲子选自孔尚任爷爷写的戏曲《桃花扇》。它讲的是：明朝灭亡之后，南京秦淮河一带以前特别热闹的地方，全都冷清了下来。以前秦淮河两岸是热闹的歌楼，如今窗户纸破了，被风吹得哗哗响，栏杆也坏了，潮水拍打着岸边，看得人心里非常难过。当年那些漂亮的歌女、好听的音乐都去哪儿了？端午节不再有挂满灯彩的游船，重阳节也没人挂酒旗喝酒了。只剩白鸟在天上飞，绿水哗哗地流，嫩黄的花儿还有几只蝴蝶来采，可是新红的枫叶却没有人来看了——从前有多热闹，现在就有多冷清。",
    words:{ "秦淮":"南京的秦淮河，古代最热闹繁华的地方", "窗寮":"窗户", "槛":"栏杆", "目断魂消":"看得伤心，非常难过", "粉黛":"化妆品，这里指歌女、美人", "笙箫":"乐器，这里指音乐", "灯船":"挂满灯彩的游船", "端阳":"端午节", "酒旗":"酒馆门口挂的布旗", "重九":"重阳节", "滔滔":"水很大的样子" } },

  { id:"huanghelou", title:"黄鹤楼", author:"崔颢", dynasty:"唐", week:"第七周",
    lines:["昔人已乘黄鹤去","此地空余黄鹤楼","黄鹤一去不复返","白云千载空悠悠","晴川历历汉阳树","芳草萋萋鹦鹉洲","日暮乡关何处是","烟波江上使人愁"],
    pinyin:["xī rén yǐ chéng huáng hè qù","cǐ dì kōng yú huáng hè lóu","huáng hè yī qù bù fù fǎn","bái yún qiān zǎi kōng yōu yōu","qíng chuān lì lì hàn yáng shù","fāng cǎo qī qī yīng wǔ zhōu","rì mù xiāng guān hé chù shì","yān bō jiāng shàng shǐ rén chóu"],
    note:"诗人崔颢登上武昌的黄鹤楼。传说有仙人骑着黄鹤从这里飞走，诗人想象：仙人已经乘着黄鹤飞走了，这里只留下一座空空的黄鹤楼。黄鹤一去就再也没有回来，只有白云千年来一直在天上飘。晴天的时候，可以清清楚楚看见汉阳的树，鹦鹉洲上长满茂盛的青草。到了傍晚，望着茫茫的江面，诗人想：我的家乡在哪里呢？眼前烟雾笼罩的江水，让人心中涌起深深的乡愁。这首诗太有名了，传说后来李白来此想题诗，看到崔颢这首诗都自叹不如。",
    words:{ "昔人":"从前的人（指传说中乘鹤飞走的仙人）", "空余":"只剩下", "千载":"一千年，形容很久", "悠悠":"飘荡不停的样子", "晴川":"晴天阳光下的江面", "历历":"清清楚楚", "萋萋":"草木茂盛的样子", "鹦鹉洲":"长江中的一个小洲，在武昌附近", "乡关":"家乡", "烟波":"烟雾笼罩的水面" } },

  { id:"zibaozhe", title:"自暴者", author:"孟子", dynasty:"战国", week:"第七周",
    lines:["自暴者，不可与有言也；","自弃者，不可与有为也。","言非礼义，谓之自暴也；","吾身不能居仁由义，谓之自弃也。","仁，人之安宅也；","义，人之正路也。","旷安宅而弗居，舍正路而不由，哀哉！"],
    pinyin:["zì bào zhě，bù kě yǔ yǒu yán yě；","zì qì zhě，bù kě yǔ yǒu wéi yě。","yán fēi lǐ yì，wèi zhī zì bào yě；","wú shēn bù néng jū rén yóu yì，wèi zhī zì qì yě。","rén，rén zhī ān zhái yě；","yì，rén zhī zhèng lù yě。","kuàng ān zhái ér fú jū，shě zhèng lù ér bù yóu，āi zāi！"],
    note:"这段话选自《孟子·离娄上》。孟子说：自己糟蹋自己的人，没办法和他谈论有价值的话；自己放弃自己的人，没办法和他一起做有价值的事。说话诋毁礼义，这就是“自暴”；认为自己不能心存仁爱、走正道，这就是“自弃”。仁，是人最安稳的家；义，是人最正确的路。空着安稳的家不住，放着正确的路不走，真是太可悲了。这段话告诉我们要珍惜自己、努力向上，不要自暴自弃。",
    words:{ "自暴":"自己糟蹋、损害自己", "自弃":"自己放弃自己，不求上进", "有言":"有价值的言论", "有为":"做有价值的事", "礼义":"礼仪和道义", "居仁由义":"心里存着仁爱，做事遵循道义", "安宅":"安稳的家（比喻仁）", "正路":"正确的道路（比喻义）", "旷":"空着、荒废", "弗":"不", "舍":"放弃", "哀":"可悲" } },

  { id:"shitoucheng", title:"金陵五题·石头城", author:"刘禹锡", dynasty:"唐", week:"第八周",
    lines:["山围故国周遭在","潮打空城寂寞回","淮水东边旧时月","夜深还过女墙来"],
    pinyin:["shān wéi gù guó zhōu zāo zài","cháo dǎ kōng chéng jì mò huí","huái shuǐ dōng biān jiù shí yuè","yè shēn hái guò nǚ qiáng lái"],
    note:"选自刘禹锡的组诗《金陵五题》。金陵就是现在的南京，曾经是六朝的古都，特别繁华。诗人来到这里，看见石头城周围的山还在，可城已经空了：江水拍打着空空的城墙，又寂寞地退回去。只有秦淮河东边那轮照着古城的月亮，夜深的时候还像从前一样，照过城墙上的女墙。诗人借“城空、月依旧”的景色，感叹当年的繁华早就烟消云散了。",
    words:{ "故国":"从前的都城（这里指六朝古都金陵）", "周遭":"周围", "空城":"空荡荡的城池", "寂寞回":"潮水拍打空城后寂寞地退回去", "淮水":"秦淮河", "旧时月":"从前照过古城的月亮", "女墙":"城墙上凹凸的小墙，也叫垛墙" } },

  { id:"loushiming", title:"陋室铭", author:"刘禹锡", dynasty:"唐", week:"第八周",
    lines:["山不在高，有仙则名","水不在深，有龙则灵","斯是陋室，惟吾德馨","苔痕上阶绿，草色入帘青","谈笑有鸿儒，往来无白丁","可以调素琴，阅金经","无丝竹之乱耳，无案牍之劳形","南阳诸葛庐，西蜀子云亭","孔子云：何陋之有"],
    pinyin:["shān bù zài gāo，yǒu xiān zé míng","shuǐ bù zài shēn，yǒu lóng zé líng","sī shì lòu shì，wéi wú dé xīn","tái hén shàng jiē lǜ，cǎo sè rù lián qīng","tán xiào yǒu hóng rú，wǎng lái wú bái dīng","kě yǐ tiáo sù qín，yuè jīn jīng","wú sī zhú zhī luàn ěr，wú àn dú zhī láo xíng","nán yáng zhū gě lú，xī shǔ zǐ yún tíng","kǒng zǐ yún：hé lòu zhī yǒu"],

// 简单的成功/失败音效（用网页自带声音，无需文件）
let audioCtx;
function beep(freq, dur, type){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function goodSound(){ beep(660,.12); setTimeout(()=>beep(880,.18),110); }
function badSound(){ beep(220,.25,'triangle'); }

/* ---- 背景音乐（用网页合成，无需音乐文件，离线可用）---- */
const MUSIC_KEY='poetry_game_music_v1';
let musicTimer=null, musicOn=false, musicOscs=[], musicGain=null;
// C宫五声音阶：do re mi sol la（柔和的中式小调）
const SCALE=[523.25,587.33,659.25,783.99,880.00];
const MELODY=[0,2,4,3,4, 2,1,0,-1, 0,1,2,4, 2,1,0,-1, 0,2,4,3, 4,2,1,0, 2,4,3,4, 2,0,-1,-1];
const NOTE_LEN=0.8;
function musicNote(freq,t,dur){
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1100;
    o.type='triangle'; o.frequency.value=freq;
    o.connect(f); f.connect(g); g.connect(musicGain);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.1);
    musicOscs.push(o);
  }catch(e){}
}
function scheduleMusicLoop(){
  if(!musicOn||!audioCtx) return;
  const base=audioCtx.currentTime+0.2;
  MELODY.forEach((step,i)=>{ if(step<0) return; musicNote(SCALE[step], base+i*NOTE_LEN, NOTE_LEN*0.92); });
  musicTimer=setTimeout(scheduleMusicLoop, MELODY.length*NOTE_LEN*1000-150);
}
function startMusic(){
  try{
    if(!('AudioContext' in window||'webkitAudioContext' in window)){ toast('当前浏览器不支持音频'); return; }
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(!musicGain){ musicGain=audioCtx.createGain(); musicGain.gain.value=0.12; musicGain.connect(audioCtx.destination); }
    audioCtx.resume && audioCtx.resume();
    musicOn=true;
    scheduleMusicLoop();
    updateMusicBtn();
  }catch(e){}
}
function stopMusic(){
  musicOn=false;
  if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; }
  musicOscs.forEach(o=>{ try{o.stop();}catch(e){} });
  musicOscs=[];
  updateMusicBtn();
}
function updateMusicBtn(){ $('#musicBtn').textContent = musicOn ? '🎵 音乐：开' : '🎵 音乐：关'; }

// 中文朗读
function speak(text, rate){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=rate||0.8; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

let currentPoem = null;

  const grid=$('#poemGrid'); grid.innerHTML='';
  const poems=allPoems();

  const groups={};
  poems.forEach(p=>{ const w=p.week||'未分组'; (groups[w]=groups[w]||[]).push(p); });
  const weekOrder=Object.keys(groups).sort((a,b)=>{

/* ---- 挖空填字 ---- */
function startBlank(){
  const p=currentPoem;
  const level=AGE_LEVELS[ageIdx];
  // 把每句拆成字，逐句挖空
  let queue=[];
  const punct=/[\s，。、；：？！,.!?;:·“”‘’]/;
  p.lines.forEach((ln,li)=>{
    const chars=[...ln];
    const cands=[];
    chars.forEach((c,i)=>{ if(!punct.test(c)) cands.push(i); });
    if(cands.length>0){
      const idx=cands[Math.floor(Math.random()*cands.length)];
      queue.push({li, idx, char:chars[idx], line:ln, chars});
    }
  });
  if(queue.length===0) queue.push({li:0,idx:0,char:[...p.lines[0]][0],line:p.lines[0],chars:[...p.lines[0]]});
  let q=0, stars=0;
  function render(){
    const item=queue[q];
    const chars=item.chars;
    let lineHtml='';
    chars.forEach((c,i)=>{
      if(i===item.idx){ lineHtml += `<span class="blank" id="bk">?</span>`; }
      else lineHtml += c;
    });
    // 选项：正确答案 + 干扰字（从全诗随机取）
    const pool=[];
    p.lines.forEach(l=>[...l].forEach(c=>{ if(c!==item.char && !/[\s，。、]/.test(c)) pool.push(c); }));
    const distract=new Set();
    while(distract.size<level.opts-1 && pool.length){ distract.add(pool[Math.floor(Math.random()*pool.length)]); }
    const opts=shuffle([item.char, ...distract]);
    $('#gameCard').innerHTML = `
      <h2>✏️ 挖空填字　第 ${q+1}/${queue.length} 句</h2>
      <div class="poem-show" style="font-size:1.3em; margin:18px 0;">${lineHtml}</div>
      <div class="opts" id="optBox"></div>`;
    const box=$('#optBox');
    opts.forEach(o=>{
      const b=document.createElement('div'); b.className='opt'; b.textContent=o;
      b.onclick=()=>{
        if(o===item.char){
          b.classList.add('ok'); goodSound(); stars++;
          setTimeout(()=>{ q++; if(q<queue.length) render(); else finish(stars,queue.length); },550);
        }else{
          b.classList.add('no'); badSound();
          setTimeout(()=>b.classList.remove('no'),450);
        }
      };
      box.appendChild(b);
    });
  }
  render();
}

/* ---- 对句选择 ---- */
function startMatch(){
  const p=currentPoem;
  // 构造问题：上一句 -> 下一句
  let qs=[];
  for(let i=0;i<p.lines.length-1;i++){
    qs.push({q:p.lines[i], a:p.lines[i+1]});
  }
  if(qs.length===0) qs.push({q:p.lines[0], a:p.lines[0]});
  qs=shuffle(qs);
  let qi=0, stars=0; const level=AGE_LEVELS[ageIdx];
  function render(){
    const item=qs[qi];
    // 干扰项：从全诗其它句子取
    const others=p.lines.filter(l=>l!==item.a);
    const distract=shuffle(others).slice(0, Math.min(level.opts-1, others.length));
    const opts=shuffle([item.a, ...distract]);
    $('#gameCard').innerHTML=`
      <h2>🔗 对句选择　第 ${qi+1}/${qs.length} 题</h2>
      <div class="poem-show" style="font-size:1.4em; margin:18px 0;">${item.q}</div>
      <div class="mini">猜一猜，下一句是什么？</div>
      <div class="opts" id="optBox"></div>`;
    const box=$('#optBox');
    opts.forEach(o=>{
      const b=document.createElement('div'); b.className='opt'; b.textContent=o; b.style.fontSize='1.1em';
      b.onclick=()=>{
        if(o===item.a){ b.classList.add('ok'); goodSound(); stars++;
          setTimeout(()=>{ qi++; if(qi<qs.length) render(); else finish(stars,qs.length); },550);
        }else{ b.classList.add('no'); badSound(); setTimeout(()=>b.classList.remove('no'),450); }
      };
      box.appendChild(b);
    });
  }
  render();
}

/* ---- 诗句排序 ---- */
function startOrder(){
  const p=currentPoem;
  const correct=p.lines;
  let shuffled=shuffle([...correct]);
  // 保证不是已经正确的顺序
  if(shuffled.join('|')===correct.join('|')) shuffled=shuffle(shuffled);
  let picked=null;
  $('#gameCard').innerHTML=`
    <h2>🔀 诗句排序</h2>
    <div class="mini">按正确的顺序，一句一句点出来 👇</div>
    <div id="orderBox" style="margin-top:10px;"></div>
    <div class="row center" style="margin-top:14px;">
      <button class="btn ghost" id="orderReset">↩️ 重排</button>
      <button class="btn" id="orderCheck">✅ 检查</button>
    </div>`;
  const box=$('#orderBox');
  function draw(){
    box.innerHTML='';
    shuffled.forEach((ln,i)=>{
      const c=document.createElement('div');
      c.className='order-card'+(picked===i?' picked':'');
      c.textContent=(i+1)+'. '+ln;
      c.onclick=()=>{
        if(picked===null){ picked=i; draw(); return; }
        if(picked===i){ picked=null; draw(); return; }
        // 交换
        [shuffled[picked],shuffled[i]]=[shuffled[i],shuffled[picked]];
        picked=null; draw();
      };
      box.appendChild(c);
    });
  }
  draw();
  $('#orderReset').onclick=()=>{ shuffled=shuffle([...correct]); if(shuffled.join('|')===correct.join('|')) shuffled=shuffle(shuffled); picked=null; draw(); };
  $('#orderCheck').onclick=()=>{
    if(shuffled.join('|')===correct.join('|')){
      celebrate(); goodSound();
      setTimeout(()=>finish(3,3),300);
    }else{
      badSound(); toast('再看看，顺序还不对哦~');
    }
  };
}

/* ---- 听读跟读 ---- */
function startRead(){
  const p=currentPoem;
  $('#gameCard').innerHTML=`
    <h2>🎤 听读跟读</h2>
    <div class="poem-show" style="font-size:1.2em; margin:12px 0;" id="readLines"></div>
    <div class="row center" style="margin:12px 0;">
      <button class="btn blue" id="readSlow">🔊 慢速朗读</button>
    </div>
    <div class="note">${p.note||''}</div>`;
  $('#readLines').innerHTML = p.lines.map((l,i)=>`<div data-i="${i}">${l}</div>`).join('');
  $('#readSlow').onclick=()=>{
    speak(p.lines.join('。'), 0.6);
    // 逐句高亮
    p.lines.forEach((l,i)=> setTimeout(()=>{
      $$('#readLines div').forEach(d=>d.style.background='');
      const d=document.querySelector(`#readLines div[data-i="${i}"]`); if(d) d.style.background='#fff0c8';
    }, i*2200));
  };
  // 完成后给奖励
  setTimeout(()=>{
    const done=document.createElement('button');
    done.className='btn'; done.textContent='🌟 我背完啦！';
    done.style.marginTop='14px';
    done.onclick=()=>{ celebrate(); goodSound(); finish(3,3); };
    $('#gameCard').appendChild(done);
  }, 600);
}

/* ===================== 结束 ===================== */
function finish(stars, total){
  const rate = total? stars/total : 1;
  let emoji='🎉', text='太棒啦！';
  if(rate>=1){ emoji='🏆'; text='全对！你真是背诗小能手！'; }
  else if(rate>=0.6){ emoji='🌟'; text='很不错，再多练几次就熟啦！'; }
  else { emoji='💪'; text='没关系，多读几遍就记住了，加油！'; }
  $('#resEmoji').textContent=emoji;
  $('#resStars').textContent='⭐'.repeat(stars)+'☆'.repeat(Math.max(0,total-stars));
  $('#resText').textContent=text;
  celebrate(); goodSound();
  show('result');
}

/* ===================== 事件绑定 ===================== */
$('#backToMenu').onclick=()=>show('menu');
$('#homeBtn').onclick=()=>{ renderPoemGrid(); show('menu'); };
$('#backToModes1').onclick=()=>show('modes');
$('#backToModes2').onclick=()=>show('modes');
$$('.mode-tile').forEach(b=> b.onclick=()=>openGame(b.dataset.mode));
$('#replayBtn').onclick=()=>{ const m=lastMode; openGame(m); };
$('#resAgain').onclick=()=>openGame(lastMode);
$('#resMenu').onclick=()=>{ renderPoemGrid(); show('menu'); };
$('#readAllBtn').onclick=()=>speak(currentPoem.lines.join('。'),0.8);

let lastMode='blank';
const _openGame=openGame;
openGame=function(m){ lastMode=m; _openGame(m); };

// 难度切换
$('#ageBtn').onclick=()=>{
  ageIdx=(ageIdx+1)%AGE_LEVELS.length;
  localStorage.setItem(AGE_KEY, ageIdx);
  applyAge(); toast('难度：'+AGE_LEVELS[ageIdx].label);
};

// 背景音乐开关
$('#musicBtn').onclick=()=>{
  if(musicOn){ stopMusic(); localStorage.setItem(MUSIC_KEY,'0'); }
  else{ startMusic(); localStorage.setItem(MUSIC_KEY,'1'); }
};
updateMusicBtn();
// 如果上次开着音乐，等孩子第一次点击页面时自动开始（浏览器要求先有操作才能出声）
if(localStorage.getItem(MUSIC_KEY)==='1'){
  const once=function(){ startMusic(); document.removeEventListener('pointerdown', once); };
  document.addEventListener('pointerdown', once);
}

/* ===================== 启动 ===================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
applyAge();
renderPoemGrid();
show('menu');
</script>
