<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>一剪梅 · 诗词背诵小游戏</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffef9;
    --text: #3a3226;
    --text-light: #6b5e4a;
    --accent: #b5343a;
    --accent-light: #d4745c;
    --gold: #c9a44b;
    --gold-light: #e8d5a3;
    --green: #5a8a6a;
    --green-light: #c8e6c9;
    --red: #c0392b;
    --shadow: rgba(58,50,38,0.08);
    --radius: 16px;
    --font-title: 'STKaiti', 'KaiTi', '楷体', 'FangSong', '仿宋', 'SimSun', '宋体', serif;
    --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 16px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 花瓣飘落背景 ===== */
  .petals-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .petal {
    position: absolute; top: -40px;
    font-size: 22px; opacity: 0.35;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.35; }
    25%  { opacity: 0.5; }
    50%  { transform: translateY(50vh) rotate(180deg) scale(0.8); opacity: 0.25; }
    75%  { opacity: 0.4; }
    100% { transform: translateY(105vh) rotate(360deg) scale(0.6); opacity: 0; }
  }

  /* ===== 主容器 ===== */
  .app-container {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 0 16px; padding-bottom: var(--safe-bottom);
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* ===== 顶部导航 ===== */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; position: sticky; top: 0; z-index: 10;
    background: var(--bg); gap: 12px;
  }
  .top-bar .back-btn {
    width: 40px; height: 40px; border: none; background: var(--card);
    border-radius: 50%; font-size: 20px; color: var(--text);
    cursor: pointer; box-shadow: 0 2px 8px var(--shadow);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.2s;
  }
  .top-bar .back-btn:active { transform: scale(0.93); }
  .progress-wrap {
    flex: 1; height: 8px; background: #e0d9cd; border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent-light), var(--accent));
    border-radius: 4px; transition: width 0.5s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 12px; color: var(--text-light); flex-shrink: 0;
    min-width: 36px; text-align: right;
  }
  .score-badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 14px; font-weight: 600; color: var(--gold);
    flex-shrink: 0;
  }
  .score-badge .star { font-size: 18px; }

  /* ===== 页面容器 ===== */
  .page {
    display: none; flex-direction: column; flex: 1;
    animation: fadeSlideIn 0.35s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 首页 ===== */
  .home-page { align-items: center; justify-content: center; text-align: center; }
  .seal-badge {
    width: 80px; height: 80px; border: 3px solid var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title); font-size: 36px; color: var(--accent);
    transform: rotate(-5deg); margin-bottom: 20px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .home-page h1 {
    font-family: var(--font-title); font-size: 30px;
    color: var(--accent); line-height: 1.3; margin-bottom: 4px;
  }
  .home-page .subtitle {
    font-size: 14px; color: var(--text-light); margin-bottom: 8px;
  }
  .home-page .author {
    font-family: var(--font-title); font-size: 18px;
    color: var(--text-light); margin-bottom: 28px;
  }
  .home-divider {
    width: 60px; height: 2px; background: var(--gold);
    margin: 0 auto 24px; border-radius: 1px;
  }
  .home-btns { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 300px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 24px; border: none; border-radius: var(--radius);
    font-size: 17px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body); transition: all 0.2s;
    position: relative; overflow: hidden;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #a02c30);
    color: #fff; box-shadow: 0 4px 16px rgba(181,52,58,0.3);
  }
  .btn-outline {
    background: var(--card); color: var(--accent);
    border: 2px solid var(--accent);
  }
  .btn-ghost {
    background: transparent; color: var(--text-light);
    font-weight: 500; padding: 12px;
  }
  .btn-resume {
    background: linear-gradient(135deg, var(--gold), #b8923a);
    color: #fff; box-shadow: 0 4px 16px rgba(201,164,75,0.35);
  }

  /* ===== 学习页面 ===== */
  .learn-page { padding-top: 8px; }
  .learn-header {
    text-align: center; margin-bottom: 16px;
  }
  .learn-header h2 {
    font-family: var(--font-title); font-size: 22px; color: var(--accent);
  }
  .full-poem {
    background: var(--card); border-radius: var(--radius);
    padding: 20px 18px; box-shadow: 0 2px 12px var(--shadow);
    font-family: var(--font-title); font-size: 18px;
    line-height: 2.2; letter-spacing: 1px; color: var(--text);
    text-align: center; border: 1px solid #e8e0d3;
    margin-bottom: 16px;
  }
  .full-poem .highlight-line {
    display: inline-block; padding: 2px 8px; margin: 0 2px;
    border-radius: 6px; cursor: pointer; transition: all 0.2s;
    position: relative;
  }
  .full-poem .highlight-line.tapped {
    background: #fff3e0; color: var(--accent);
    font-weight: bold;
  }
  .meaning-card {
    background: #faf6ee; border-radius: 12px; padding: 16px 18px;
    border-left: 3px solid var(--gold); margin-top: 12px;
    display: none; font-size: 14px; color: var(--text-light);
    line-height: 1.7; animation: fadeSlideIn 0.3s ease;
  }
  .meaning-card.show { display: block; }
  .meaning-card .original { font-weight: 600; color: var(--accent); margin-bottom: 4px; }

  /* ===== 闯关页面 ===== */
  .challenge-page { align-items: center; }
  .challenge-card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 20px 24px; box-shadow: 0 4px 20px var(--shadow);
    width: 100%; text-align: center; border: 1px solid #e8e0d3;
    margin-top: 8px;
  }
  .challenge-number {
    font-size: 13px; color: var(--text-light); letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .challenge-type-badge {
    display: inline-block; padding: 3px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .badge-fill { background: #fce4ec; color: var(--accent); }
  .badge-sort { background: #e8f5e9; color: var(--green); }

  /* 填空模式 */
  .fill-sentence {
    font-family: var(--font-title); font-size: 26px;
    letter-spacing: 6px; margin: 20px 0 24px;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 4px; line-height: 1.6;
  }
  .fill-sentence .blank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border: 2px dashed var(--accent);
    border-radius: 8px; color: var(--accent); font-size: 22px;
    margin: 0 4px; transition: all 0.3s;
  }
  .fill-sentence .blank.filled {
    border-style: solid; background: #fce4ec;
    animation: popIn 0.3s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .fill-sentence .comma { color: var(--text); letter-spacing: 0; }
  .options-grid {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    margin: 8px 0 20px;
  }
  .option-btn {
    width: 52px; height: 52px; border: 2px solid #d5cdbb;
    border-radius: 12px; background: var(--card);
    font-family: var(--font-title); font-size: 22px; color: var(--text);
    cursor: pointer; transition: all 0.2s;
    touch-action: manipulation;
  }
  .option-btn:active { transform: scale(0.9); }
  .option-btn.chosen { border-color: var(--accent); background: #fce4ec; color: var(--accent); }
  .option-btn.correct { border-color: var(--green); background: var(--green-light); color: var(--green); animation: popIn 0.3s ease; }
  .option-btn.wrong { border-color: var(--red); background: #ffebee; color: var(--red); animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }

  /* 排序模式 */
  .sort-target {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    min-height: 56px; padding: 12px; margin: 16px 0;
    border: 2px dashed #d5cdbb; border-radius: 12px;
    background: #faf8f3; align-items: center;
  }
  .sort-target.filled { border-color: var(--green); border-style: solid; }
  .sort-chunk {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 14px; border-radius: 10px;
    font-family: var(--font-title); font-size: 18px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
    touch-action: manipulation; user-select: none;
  }
  .sort-chunk.in-pool {
    background: var(--card); border: 1.5px solid #d5cdbb; color: var(--text);
    box-shadow: 0 2px 6px var(--shadow);
  }
  .sort-chunk.in-target {
    background: #e8f5e9; border: 1.5px solid var(--green); color: var(--green);
    box-shadow: 0 2px 6px var(--shadow);
  }
  .sort-chunk:active { transform: scale(0.92); }
  .sort-pool {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin: 12px 0;
  }
  .sort-hint {
    font-size: 13px; color: var(--text-light); margin-bottom: 6px;
  }

  /* 反馈信息 */
  .feedback {
    padding: 10px 18px; border-radius: 10px; font-size: 15px;
    font-weight: 600; margin: 12px 0; display: none;
    animation: fadeSlideIn 0.3s ease;
  }
  .feedback.show { display: block; }
  .feedback.success { background: var(--green-light); color: var(--green); }
  .feedback.error { background: #ffebee; color: var(--red); }
  .feedback .meaning-hint {
    display: block; font-weight: 400; font-size: 13px; margin-top: 4px;
    color: var(--text-light);
  }

  .btn-next {
    display: none; margin-top: 8px;
  }
  .btn-next.show { display: inline-flex; }
  .btn-sm {
    padding: 12px 28px; font-size: 15px;
  }

  /* ===== 结果页面 ===== */
  .result-page { align-items: center; justify-content: center; text-align: center; }
  .result-icon { font-size: 64px; margin-bottom: 12px; }
  .result-title {
    font-family: var(--font-title); font-size: 26px; color: var(--accent);
    margin-bottom: 8px;
  }
  .result-score { font-size: 48px; font-weight: 700; color: var(--gold); }
  .result-stats {
    display: flex; gap: 24px; margin: 20px 0;
  }
  .result-stat { text-align: center; }
  .result-stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
  .result-stat .label { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .result-poem {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: 0 2px 12px var(--shadow);
    font-family: var(--font-title); font-size: 16px;
    line-height: 2.2; color: var(--text); width: 100%;
    border: 1px solid #e8e0d3; margin: 16px 0;
  }
  .combo-text {
    font-size: 14px; color: var(--gold); font-weight: 600;
    margin: 8px 0; min-height: 20px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #3a3226; color: #fff; padding: 10px 24px;
    border-radius: 24px; font-size: 14px; z-index: 100;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 响应式 ===== */
  @media (min-width: 420px) {
    .full-poem { font-size: 20px; }
    .fill-sentence { font-size: 28px; }
    .option-btn { width: 56px; height: 56px; font-size: 24px; }
  }
</style>
</head>
<body>

<!-- 花瓣飘落 -->
<div class="petals-container" id="petalsContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 主容器 -->
<div class="app-container" id="appContainer">

  <!-- 顶部导航栏 -->
  <div class="top-bar" id="topBar" style="display:none;">
    <button class="back-btn" id="backBtn" aria-label="返回">←</button>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">0/8</span>
    <span class="score-badge">⭐ <span id="scoreDisplay">0</span></span>
  </div>

  <!-- ========= 首页 ========= -->
  <div class="page active home-page" id="homePage">
    <div class="seal-badge">词</div>
    <h1>一剪梅</h1>
    <p class="subtitle">红藕香残玉簟秋</p>
    <p class="author">【宋】李清照</p>
    <div class="home-divider"></div>
    <div class="home-btns">
      <button class="btn btn-primary" id="btnLearn">
        📖 朗读学习
      </button>
      <button class="btn btn-outline" id="btnStart">
        🎯 开始闯关
      </button>
      <button class="btn btn-resume" id="btnResume" style="display:none;">
        🔄 继续闯关
      </button>
    </div>
  </div>

  <!-- ========= 学习页面 ========= -->
  <div class="page learn-page" id="learnPage">
    <div class="learn-header">
      <h2>一剪梅 · 红藕香残玉簟秋</h2>
      <p style="color:var(--text-light);font-size:13px;margin-top:4px;">【宋】李清照  ·  点击诗句查看释义</p>
    </div>
    <div class="full-poem" id="fullPoem"></div>
    <div class="meaning-card" id="meaningCard"></div>
    <button class="btn btn-outline" id="btnLearnToChallenge" style="margin-top:16px;width:100%;">
      🎯 我学会了，去闯关！
    </button>
  </div>

  <!-- ========= 闯关页面 ========= -->
  <div class="page challenge-page" id="challengePage">
    <div class="challenge-card" id="challengeCard">
      <!-- 动态渲染 -->
    </div>
  </div>

  <!-- ========= 结果页面 ========= -->
  <div class="page result-page" id="resultPage">
    <div class="result-icon" id="resultIcon">🎉</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-stats">
      <div class="result-stat">
        <div class="num" id="resultCorrect">0</div>
        <div class="label">答对</div>
      </div>
      <div class="result-stat">
        <div class="num" id="resultTotal">8</div>
        <div class="label">总题</div>
      </div>
      <div class="result-stat">
        <div class="num" id="resultCombo">0</div>
        <div class="label">最大连击</div>
      </div>
    </div>
    <div class="result-poem" id="resultPoem"></div>
    <div class="home-btns" style="gap:10px;">
      <button class="btn btn-primary btn-sm" id="btnReplay">🔄 再来一次</button>
      <button class="btn btn-outline btn-sm" id="btnResultLearn">📖 再看看诗词</button>
      <button class="btn btn-ghost btn-sm" id="btnBackHome">🏠 回到首页</button>
    </div>
  </div>

</div>

<script>
// ==================== 诗词数据 ====================
const VERSES = [
  {
    id: 1,
    text: '红藕香残玉簟秋',
    pinyin: 'hóng ǒu xiāng cán yù diàn qiū',
    meaning: '红色的荷花已经凋谢，只留下淡淡的残香；光滑如玉的竹席，已经让人感到秋天的凉意。',
    keywords: '红藕：红色的荷花。玉簟(diàn)：光滑如玉的竹席。',
    sortChunks: ['红藕', '香残', '玉簟秋'],
    blankIndex: 3  // 挖空"残"
  },
  {
    id: 2,
    text: '轻解罗裳，独上兰舟',
    pinyin: 'qīng jiě luó cháng，dú shàng lán zhōu',
    meaning: '我轻轻提起罗裙，独自一人登上了木兰舟。写出了词人独自出行的寂寞。',
    keywords: '罗裳(cháng)：丝罗做的裙子。兰舟：木兰树做的船，指华美的小船。',
    sortChunks: ['轻解', '罗裳', '独上', '兰舟'],
    blankIndex: 5  // 挖空"独"
  },
  {
    id: 3,
    text: '云中谁寄锦书来',
    pinyin: 'yún zhōng shuí jì jǐn shū lái',
    meaning: '仰望天空，谁会从远方给我寄来书信呢？「锦书」指书信，表达了对远方亲人音信的期盼。',
    keywords: '锦书：书信的美称。传说大雁能传递书信。',
    sortChunks: ['云中', '谁寄', '锦书来'],
    blankIndex: 2  // 挖空"谁"
  },
  {
    id: 4,
    text: '雁字回时，月满西楼',
    pinyin: 'yàn zì huí shí，yuè mǎn xī lóu',
    meaning: '当大雁排着「人」字形飞回来的时候，皎洁的月光已经洒满了西边的楼阁。暗示等到深夜也未见来信。',
    keywords: '雁字：大雁飞行时排成「人」字或「一」字形。',
    sortChunks: ['雁字', '回时', '月满', '西楼'],
    blankIndex: 4  // 挖空"月"
  },
  {
    id: 5,
    text: '花自飘零水自流',
    pinyin: 'huā zì piāo líng shuǐ zì liú',
    meaning: '花儿各自飘落凋零，水各自向远方流淌。用自然景物比喻离别和身不由己的无奈。',
    keywords: '自：各自，各自顾自地。飘零：凋谢飘落。',
    sortChunks: ['花自', '飘零', '水自流'],
    blankIndex: 2  // 挖空"飘"
  },
  {
    id: 6,
    text: '一种相思，两处闲愁',
    pinyin: 'yī zhǒng xiāng sī，liǎng chù xián chóu',
    meaning: '虽然是一样的相思之情，却分隔两地，各自在闲适中品味着忧愁。写出了夫妻异地而居的共同愁苦。',
    keywords: '一种：同一种。两处：两地（指词人和丈夫）。闲愁：闲适中涌起的愁绪。',
    sortChunks: ['一种', '相思', '两处', '闲愁'],
    blankIndex: 3  // 挖空"相"
  },
  {
    id: 7,
    text: '此情无计可消除',
    pinyin: 'cǐ qíng wú jì kě xiāo chú',
    meaning: '这种相思之情，没有什么办法可以排遣消除。直接表达了愁绪的浓重和无法排解的无奈。',
    keywords: '无计：没有办法。消除：排遣、消除。',
    sortChunks: ['此情', '无计', '可消除'],
    blankIndex: 4  // 挖空"消"
  },
  {
    id: 8,
    text: '才下眉头，却上心头',
    pinyin: 'cái xià méi tóu，què shàng xīn tóu',
    meaning: '刚刚舒展开了眉头（好像不那么愁了），愁绪却又悄悄地涌上了心头。这句是千古名句，把相思之情的缠绵挥之不去写得极其生动。',
    keywords: '下眉头：眉头舒展，不皱眉了。上心头：涌上心间。',
    sortChunks: ['才下', '眉头', '却上', '心头'],
    blankIndex: 7  // 挖空"心"
  }
];

// 所有出现的字（用于生成干扰项）
const ALL_CHARS = [...new Set(VERSES.map(v => [...v.text.replace(/[，。？！、]/g, '')]).flat())];
function getRandomDistractors(correct, count = 3) {
  const pool = ALL_CHARS.filter(c => c !== correct);
  const shuffled = pool.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

// ==================== 游戏状态 ====================
const state = {
  currentPage: 'home',
  challengeIndex: 0,
  score: 0,
  correctCount: 0,
  combo: 0,
  maxCombo: 0,
  fillAnswer: null,
  sortAnswer: [],
  completed: false,
  wrongAttempts: 0  // 当前题错误次数
};

// ==================== DOM 引用 ====================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const homePage = $('#homePage');
const learnPage = $('#learnPage');
const challengePage = $('#challengePage');
const resultPage = $('#resultPage');
const topBar = $('#topBar');
const progressFill = $('#progressFill');
const progressLabel = $('#progressLabel');
const scoreDisplay = $('#scoreDisplay');
const challengeCard = $('#challengeCard');
const meaningCard = $('#meaningCard');
const fullPoem = $('#fullPoem');
const toast = $('#toast');

// ==================== 页面切换 ====================
function showPage(name) {
  [homePage, learnPage, challengePage, resultPage].forEach(p => p.classList.remove('active'));
  state.currentPage = name;
  if (name === 'home') {
    homePage.classList.add('active');
    topBar.style.display = 'none';
    updateHomeButtons();
  } else if (name === 'learn') {
    learnPage.classList.add('active');
    topBar.style.display = 'flex';
    updateProgress();
  } else if (name === 'challenge') {
    challengePage.classList.add('active');
    topBar.style.display = 'flex';
    updateProgress();
  } else if (name === 'result') {
    resultPage.classList.add('active');
    topBar.style.display = 'none';
  }
}

function updateProgress() {
  const total = VERSES.length;
  const done = state.challengeIndex;
  const pct = total > 0 ? (done / total * 100) : 0;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = done + '/' + total;
  scoreDisplay.textContent = state.score;
}

// ==================== Toast ====================
let toastTimer;
function showToast(msg, duration = 1800) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

// ==================== 保存/恢复进度 ====================
function saveProgress() {
  const data = {
    challengeIndex: state.challengeIndex,
    score: state.score,
    correctCount: state.correctCount,
    combo: state.combo,
    maxCombo: state.maxCombo,
    completed: state.completed
  };
  try { localStorage.setItem('yijianmei_progress', JSON.stringify(data)); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem('yijianmei_progress');
    if (raw) {
      const data = JSON.parse(raw);
      state.challengeIndex = data.challengeIndex || 0;
      state.score = data.score || 0;
      state.correctCount = data.correctCount || 0;
      state.combo = data.combo || 0;
      state.maxCombo = data.maxCombo || 0;
      state.completed = data.completed || false;
      return true;
    }
  } catch(e) {}
  return false;
}

function clearProgress() {
  state.challengeIndex = 0;
  state.score = 0;
  state.correctCount = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.completed = false;
  try { localStorage.removeItem('yijianmei_progress'); } catch(e) {}
}

function updateHomeButtons() {
  const hasProgress = loadProgress() && (state.challengeIndex > 0) && !state.completed;
  $('#btnResume').style.display = hasProgress ? 'flex' : 'none';
}

// ==================== 花瓣动画 ====================
function createPetals() {
  const container = $('#petalsContainer');
  const petals = ['🌸', '🍂', '🌺', '🏵️', '💮'];
  for (let i = 0; i < 15; i++) {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.textContent = petals[Math.floor(Math.random() * petals.length)];
    petal.style.left = Math.random() * 100 + '%';
    petal.style.fontSize = (16 + Math.random() * 20) + 'px';
    petal.style.animationDuration = (8 + Math.random() * 14) + 's';
    petal.style.animationDelay = Math.random() * 12 + 's';
    container.appendChild(petal);
  }
}

// ==================== 学习页面 ====================
function buildLearnPage() {
  let html = '';
  VERSES.forEach((v, i) => {
    html += `<span class="highlight-line" data-index="${i}">${v.text}</span>`;
    if (i === 0 || i === 3 || i === 5 || i === 6) {
      html += '<br>';
    } else if (i < VERSES.length - 1) {
      // 连接词
    }
  });
  html += '<br><span style="font-size:13px;color:var(--text-light);display:block;margin-top:8px;">—— 点击每一句查看释义和拼音</span>';
  fullPoem.innerHTML = html;

  // 点击事件
  fullPoem.querySelectorAll('.highlight-line').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.index);
      const verse = VERSES[idx];
      // 高亮
      fullPoem.querySelectorAll('.highlight-line').forEach(e => e.classList.remove('tapped'));
      el.classList.add('tapped');
      // 显示释义
      meaningCard.innerHTML = `
        <div class="original">「${verse.text}」</div>
        <div style="font-size:12px;color:var(--gold);margin-bottom:6px;">${verse.pinyin}</div>
        <div>${verse.meaning}</div>
        <div style="margin-top:6px;font-size:12px;color:var(--text-light);">${verse.keywords}</div>
      `;
      meaningCard.classList.add('show');
    });
  });
}

// ==================== 闯关 - 填空模式 ====================
function renderFillChallenge(verse) {
  const chars = [...verse.text];
  // 随机选择挖空位置，避开标点
  const validIndices = chars.reduce((arr, ch, i) => {
    if (!/[，。？！、\s]/.test(ch)) arr.push(i);
    return arr;
  }, []);
  const blankIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
  const correctChar = chars[blankIdx];

  // 干扰项
  const distractors = getRandomDistractors(correctChar, 3);
  const options = [correctChar, ...distractors].sort(() => Math.random() - 0.5);

  state.fillAnswer = null;
  state.wrongAttempts = 0;

  // 构建句子展示
  let sentenceHTML = '';
  chars.forEach((ch, i) => {
    if (/[，。？！、]/.test(ch)) {
      sentenceHTML += `<span class="comma">${ch}</span>`;
    } else if (i === blankIdx) {
      sentenceHTML += `<span class="blank" id="fillBlank"></span>`;
    } else {
      sentenceHTML += `<span style="opacity:0.5;letter-spacing:4px;">${ch}</span>`;
    }
  });

  challengeCard.innerHTML = `
    <div class="challenge-number">第 ${state.challengeIndex + 1} / ${VERSES.length} 关</div>
    <span class="challenge-type-badge badge-fill">📝 填空默背</span>
    <div class="fill-sentence">${sentenceHTML}</div>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:8px;">点击正确的字填入空格</p>
    <div class="options-grid" id="optionsGrid">
      ${options.map((opt, i) => `<button class="option-btn" data-char="${opt}" data-idx="${i}">${opt}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary btn-sm btn-next" id="btnNext">下一关 →</button>
  `;

  // 绑定选项点击
  const blank = $('#fillBlank');
  const feedback = $('#feedback');
  const btnNext = $('#btnNext');
  state.fillAnswer = null;

  $$('#optionsGrid .option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.fillAnswer !== null) return; // 已作答
      const chosen = btn.dataset.char;
      state.fillAnswer = chosen;

      // 视觉反馈
      blank.textContent = chosen;
      blank.classList.add('filled');

      if (chosen === correctChar) {
        btn.classList.add('correct');
        state.score += 10 + state.combo * 2;
        state.correctCount++;
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;
        feedback.className = 'feedback show success';
        feedback.innerHTML = '✅ 太棒了！<span class="meaning-hint">' + verse.meaning + '</span>';
        btnNext.classList.add('show');
        updateProgress();
        saveProgress();
      } else {
        btn.classList.add('wrong');
        state.wrongAttempts++;
        state.combo = 0;
        feedback.className = 'feedback show error';
        feedback.innerHTML = '❌ 不对哦，再想想！正确答案是「' + correctChar + '」<span class="meaning-hint">' + verse.meaning + '</span>';
        // 显示正确答案
        blank.textContent = correctChar;
        blank.classList.add('filled');
        blank.style.background = '#ffebee';
        blank.style.borderColor = 'var(--red)';
        // 高亮正确选项
        $$('#optionsGrid .option-btn').forEach(b => {
          if (b.dataset.char === correctChar) b.classList.add('correct');
        });
        btnNext.classList.add('show');
        updateProgress();
        saveProgress();
      }
    });
  });

  // 下一关
  btnNext.addEventListener('click', () => {
    state.challengeIndex++;
    if (state.challengeIndex >= VERSES.length) {
      state.completed = true;
      saveProgress();
      showResult();
    } else {
      nextChallenge();
    }
    updateProgress();
  });
}

// ==================== 闯关 - 排序模式 ====================
function renderSortChallenge(verse) {
  const chunks = [...verse.sortChunks].sort(() => Math.random() - 0.5);
  state.sortAnswer = [];
  state.wrongAttempts = 0;

  challengeCard.innerHTML = `
    <div class="challenge-number">第 ${state.challengeIndex + 1} / ${VERSES.length} 关</div>
    <span class="challenge-type-badge badge-sort">🔀 拼句排序</span>
    <p class="sort-hint">按正确顺序点击词组，拼出完整诗句</p>
    <div class="sort-target" id="sortTarget"></div>
    <div class="sort-pool" id="sortPool">
      ${chunks.map(c => `<span class="sort-chunk in-pool" data-chunk="${c}">${c}</span>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-primary btn-sm btn-next" id="btnNext">下一关 →</button>
  `;

  const sortTarget = $('#sortTarget');
  const sortPool = $('#sortPool');
  const feedback = $('#feedback');
  const btnNext = $('#btnNext');

  function renderSortState() {
    sortTarget.innerHTML = state.sortAnswer.map((c, i) =>
      `<span class="sort-chunk in-target" data-idx="${i}">${c}</span>`
    ).join('');
    sortPool.innerHTML = chunks
      .filter(c => !state.sortAnswer.includes(c))
      .map(c => `<span class="sort-chunk in-pool" data-chunk="${c}">${c}</span>`)
      .join('');

    if (state.sortAnswer.length > 0) {
      sortTarget.classList.add('filled');
    } else {
      sortTarget.classList.remove('filled');
    }

    bindSortEvents();
  }

  function bindSortEvents() {
    // 点击词池中的词 -> 加入答案
    sortPool.querySelectorAll('.sort-chunk').forEach(el => {
      el.addEventListener('click', () => {
        if (state.sortAnswer.length >= verse.sortChunks.length) return;
        state.sortAnswer.push(el.dataset.chunk);
        renderSortState();
        checkSortComplete();
      });
    });

    // 点击答案中的词 -> 移回词池
    sortTarget.querySelectorAll('.sort-chunk').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        state.sortAnswer.splice(idx, 1);
        renderSortState();
      });
    });
  }

  function checkSortComplete() {
    if (state.sortAnswer.length === verse.sortChunks.length) {
      const correct = verse.sortChunks.join('');
      const userAnswer = state.sortAnswer.join('');
      if (userAnswer === correct) {
        state.score += 10 + state.combo * 2;
        state.correctCount++;
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;
        feedback.className = 'feedback show success';
        feedback.innerHTML = '✅ 排序正确！<span class="meaning-hint">' + verse.meaning + '</span>';
        btnNext.classList.add('show');
        updateProgress();
        saveProgress();
        // 禁用所有点击
        sortPool.querySelectorAll('.sort-chunk').forEach(e => e.style.pointerEvents = 'none');
        sortTarget.querySelectorAll('.sort-chunk').forEach(e => e.style.pointerEvents = 'none');
      } else {
        state.sortAnswer = [];
        state.wrongAttempts++;
        state.combo = 0;
        feedback.className = 'feedback show error';
        feedback.innerHTML = '❌ 顺序不对，再试试！<span class="meaning-hint">提示：' + verse.meaning + '</span>';
        updateProgress();
        saveProgress();
      }
    }
  }

  bindSortEvents();

  btnNext.addEventListener('click', () => {
    state.challengeIndex++;
    if (state.challengeIndex >= VERSES.length) {
      state.completed = true;
      saveProgress();
      showResult();
    } else {
      nextChallenge();
    }
    updateProgress();
  });
}

// ==================== 下一关 ====================
function nextChallenge() {
  const verse = VERSES[state.challengeIndex];
  // 交替填空和排序
  if (state.challengeIndex % 2 === 0) {
    renderFillChallenge(verse);
  } else {
    renderSortChallenge(verse);
  }
}

// ==================== 开始闯关 ====================
function startChallenge(fromIndex = 0) {
  state.challengeIndex = fromIndex;
  state.score = fromIndex > 0 ? state.score : 0;
  state.correctCount = fromIndex > 0 ? state.correctCount : 0;
  state.combo = 0;
  state.maxCombo = fromIndex > 0 ? state.maxCombo : 0;
  state.completed = false;
  showPage('challenge');
  nextChallenge();
}

// ==================== 结果页面 ====================
function showResult() {
  showPage('result');
  const total = VERSES.length;
  const pct = Math.round(state.correctCount / total * 100);

  let icon, title;
  if (pct >= 90) { icon = '🏆'; title = '诗词达人！'; }
  else if (pct >= 70) { icon = '🌟'; title = '掌握得很棒！'; }
  else if (pct >= 50) { icon = '👍'; title = '还需加油哦～'; }
  else { icon = '📚'; title = '再来一次吧！'; }

  $('#resultIcon').textContent = icon;
  $('#resultTitle').textContent = title;
  $('#resultScore').textContent = state.score + '分';
  $('#resultCorrect').textContent = state.correctCount;
  $('#resultTotal').textContent = total;
  $('#resultCombo').textContent = state.maxCombo;

  // 展示整首词
  let poemHTML = '';
  VERSES.forEach((v, i) => {
    poemHTML += v.text;
    if (i === 0 || i === 3 || i === 5 || i === 6) poemHTML += '<br>';
  });
  $('#resultPoem').innerHTML = poemHTML;
}

// ==================== 事件绑定 ====================
$('#backBtn').addEventListener('click', () => {
  if (state.currentPage === 'learn' || state.currentPage === 'challenge') {
    showPage('home');
  }
});

$('#btnLearn').addEventListener('click', () => {
  showPage('learn');
});

$('#btnStart').addEventListener('click', () => {
  clearProgress();
  startChallenge(0);
});

$('#btnResume').addEventListener('click', () => {
  loadProgress();
  startChallenge(state.challengeIndex);
});

$('#btnLearnToChallenge').addEventListener('click', () => {
  clearProgress();
  startChallenge(0);
});

$('#btnReplay').addEventListener('click', () => {
  clearProgress();
  startChallenge(0);
});

$('#btnResultLearn').addEventListener('click', () => {
  showPage('learn');
});

$('#btnBackHome').addEventListener('click', () => {
  showPage('home');
});

// ==================== 初始化 ====================
function init() {
  createPetals();
  buildLearnPage();
  loadProgress();
  // 初始显示首页
  showPage('home');
  updateHomeButtons();
  updateProgress();
}

init();
</script>
</body>
</html>
